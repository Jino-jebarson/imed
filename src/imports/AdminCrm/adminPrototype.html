<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iMED Academy — Admin CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --navy-950:#0A0E1D;
  --navy-900:#0F1428;
  --navy-850:#141A33;
  --navy-800:#1B2340;
  --navy-line:#242C4D;
  --indigo-500:#4F6BFF;
  --indigo-600:#3E56E0;
  --indigo-100:#EAEEFF;
  --bg:#F3F5FA;
  --card:#FFFFFF;
  --border:#E5E9F2;
  --border-soft:#EEF1F7;
  --text-900:#161B33;
  --text-700:#333A56;
  --text-600:#5B6478;
  --text-400:#99A1B3;
  --green-50:#EAFBF3; --green-500:#17A673; --green-700:#0E7A54;
  --amber-50:#FFF7E8; --amber-500:#F5A524; --amber-700:#B4750B;
  --red-50:#FDEEEE; --red-500:#E5484D; --red-700:#B3282C;
  --purple-50:#F4F0FE; --purple-500:#8B5CF6; --purple-700:#6B37D6;
  --teal-50:#EAFAF8; --teal-500:#14B8A6; --teal-700:#0B8577;
  --blue-50:#EEF3FF;
  --radius:10px;
  --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(16,20,40,.05);
  --shadow-md:0 4px 14px rgba(16,20,40,.07);
  --shadow-lg:0 12px 32px rgba(16,20,40,.14);
  --font-ui:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text-900);
  font-size:13.5px;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#C7CEE0;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--indigo-500);outline-offset:2px;}
.mono{font-family:var(--font-mono);}

/* ============ APP SHELL ============ */
#app{display:none;height:100vh;width:100vw;}
#app.active{display:flex;}
.sidebar{
  width:236px;flex:0 0 236px;background:linear-gradient(180deg,var(--navy-950),var(--navy-900));
  color:#C9CFE6;display:flex;flex-direction:column;height:100vh;position:relative;
  border-right:1px solid var(--navy-line);
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;padding:18px 18px 14px 20px;
  border-bottom:1px solid var(--navy-line);
}
.brand-mark{
  width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--indigo-500),#8A6BFF);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;flex:0 0 32px;
  box-shadow:0 4px 10px rgba(79,107,255,.4);
}
.brand-text{line-height:1.15;}
.brand-text b{display:block;font-size:14px;color:#fff;font-weight:700;letter-spacing:.2px;}
.brand-text span{display:block;font-size:10.5px;color:#8189A8;letter-spacing:.6px;text-transform:uppercase;margin-top:2px;}

.nav-scroll{flex:1;overflow-y:auto;padding:12px 10px;}
.nav-group-label{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#5D6588;padding:14px 10px 6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;margin-bottom:2px;
  color:#AEB4CE;font-size:13px;font-weight:500;cursor:pointer;transition:background .12s,color .12s;
  position:relative;
}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;opacity:.85;}
.nav-item:hover{background:var(--navy-800);color:#fff;}
.nav-item.active{background:var(--indigo-500);color:#fff;box-shadow:0 4px 12px rgba(79,107,255,.35);}
.nav-item.active svg{opacity:1;}
.nav-item .badge{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;}

.sidebar-footer{padding:12px;border-top:1px solid var(--navy-line);}
.role-pill{
  display:flex;align-items:center;gap:9px;background:var(--navy-800);border:1px solid var(--navy-line);
  border-radius:10px;padding:8px 10px;
}
.role-avatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#F5A524,#E5484D);flex:0 0 28px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:12px;}
.role-meta{line-height:1.2;overflow:hidden;}
.role-meta b{font-size:12px;color:#fff;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.role-meta span{font-size:10.5px;color:#8A91B0;}

.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{
  height:60px;flex:0 0 60px;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 22px;
}
.page-title{font-size:16px;font-weight:700;color:var(--text-900);white-space:nowrap;}
.page-sub{font-size:11.5px;color:var(--text-400);margin-top:1px;}
.topbar-spacer{flex:1;}
.scope-select, .df-select{
  border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--text-700);
  font-weight:500;font-family:inherit;
}
.date-filter{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px;}
.df-btn{border:none;background:transparent;padding:6px 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--text-600);}
.df-btn.active{background:#fff;color:var(--indigo-600);box-shadow:var(--shadow-sm);}
.df-date{border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:12px;display:none;}
.df-date.show{display:inline-block;}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-600);}
.icon-btn:hover{background:var(--bg);}
.search-box{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:7px 12px;width:230px;}
.search-box input{border:none;background:transparent;outline:none;font-size:12.5px;width:100%;color:var(--text-900);}

.content{flex:1;overflow-y:auto;padding:22px;}
.panel{display:none;}
.panel.active{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ============ COMMON UI ============ */
.grid-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px;}
.metric-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.metric-card .m-label{font-size:11.5px;color:var(--text-600);font-weight:600;display:flex;align-items:center;gap:6px;}
.metric-card .m-value{font-size:24px;font-weight:800;margin-top:8px;color:var(--text-900);font-family:var(--font-mono);}
.metric-card .m-delta{font-size:11px;font-weight:600;margin-top:6px;}
.m-delta.up{color:var(--green-700);}
.m-delta.down{color:var(--red-700);}
.metric-card .m-dot{width:9px;height:9px;border-radius:3px;display:inline-block;}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
.card-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border-soft);}
.card-head h3{font-size:13.5px;font-weight:700;margin:0;}
.card-head .sub{font-size:11px;color:var(--text-400);margin-top:2px;font-weight:500;}
.card-body{padding:16px 18px;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

.btn{border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--indigo-500);color:#fff;box-shadow:0 4px 10px rgba(79,107,255,.28);}
.btn-primary:hover{background:var(--indigo-600);}
.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text-700);}
.btn-ghost:hover{background:var(--bg);}
.btn-soft{background:var(--indigo-100);color:var(--indigo-600);}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:7px;}
.btn-danger{background:var(--red-50);color:var(--red-700);}
.btn-green{background:var(--green-50);color:var(--green-700);}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-400);
  font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:#FAFBFD;
  position:sticky;top:0;
}
tbody td{padding:11px 12px;border-bottom:1px solid var(--border-soft);color:var(--text-700);white-space:nowrap;}
tbody tr{transition:background .1s;}
tbody tr:hover{background:#F8F9FD;cursor:default;}
tbody tr.clickable{cursor:pointer;}
.cell-name{font-weight:600;color:var(--text-900);}
.cell-sub{font-size:11px;color:var(--text-400);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge-dot{width:6px;height:6px;border-radius:50%;}
.badge-blue{background:var(--blue-50);color:var(--indigo-600);}
.badge-green{background:var(--green-50);color:var(--green-700);}
.badge-amber{background:var(--amber-50);color:var(--amber-700);}
.badge-red{background:var(--red-50);color:var(--red-700);}
.badge-purple{background:var(--purple-50);color:var(--purple-700);}
.badge-teal{background:var(--teal-50);color:var(--teal-700);}
.badge-gray{background:#F1F2F6;color:var(--text-600);}

.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
select.fbtn, input.fbtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--text-700);font-family:inherit;}
.pill-tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px;}
.pill-tab{padding:7px 13px;border-radius:7px;font-size:12px;font-weight:600;color:var(--text-600);background:transparent;border:none;}
.pill-tab.active{background:#fff;color:var(--indigo-600);box-shadow:var(--shadow-sm);}

.avatar{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11.5px;flex:0 0 30px;}
.name-cell{display:flex;align-items:center;gap:9px;}

.progress-track{width:70px;height:6px;background:var(--border-soft);border-radius:10px;overflow:hidden;display:inline-block;vertical-align:middle;}
.progress-fill{height:100%;background:var(--green-500);border-radius:10px;}

.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--border-soft);font-size:12px;color:var(--text-400);}
.pager-btns{display:flex;gap:6px;}
.pager-btns button{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:12px;color:var(--text-600);}
.pager-btns button.active{background:var(--indigo-500);color:#fff;border-color:var(--indigo-500);}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-400);}
.empty-state svg{width:40px;height:40px;margin-bottom:10px;opacity:.5;}
.empty-state h4{margin:0 0 4px;color:var(--text-600);font-size:13px;}
.empty-state p{margin:0;font-size:12px;}

/* funnel */
.funnel-wrap{display:flex;flex-direction:column;gap:6px;}
.funnel-row{display:grid;grid-template-columns:120px 1fr 90px;align-items:center;gap:10px;}
.funnel-row .flabel{font-size:12px;font-weight:600;color:var(--text-600);}
.funnel-bar-track{background:var(--border-soft);border-radius:6px;height:22px;overflow:hidden;}
.funnel-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--indigo-500),#8A6BFF);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;}
.funnel-bar-fill span{color:#fff;font-size:10.5px;font-weight:700;}
.funnel-row .fval{font-size:12px;color:var(--text-400);text-align:right;font-family:var(--font-mono);}

/* modal & drawer */
.overlay{position:fixed;inset:0;background:rgba(10,14,29,.5);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(2px);}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:16px;width:600px;max-width:92vw;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal.wide{width:760px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:#fff;z-index:2;}
.modal-head h3{margin:0;font-size:15px;font-weight:700;}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border-soft);}
.close-x{width:30px;height:30px;border-radius:8px;border:none;background:var(--bg);color:var(--text-600);font-size:15px;}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-600);margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:12.5px;font-family:inherit;color:var(--text-900);background:#fff;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--indigo-500);}
.field .hint{font-size:10.5px;color:var(--text-400);margin-top:4px;}

.drawer-overlay{position:fixed;inset:0;background:rgba(10,14,29,.45);display:none;z-index:200;}
.drawer-overlay.show{display:block;}
.drawer{position:fixed;top:0;right:0;height:100vh;width:520px;max-width:94vw;background:#fff;box-shadow:-14px 0 40px rgba(10,14,29,.25);
  transform:translateX(100%);transition:transform .22s ease;z-index:201;display:flex;flex-direction:column;}
.drawer.show{transform:translateX(0);}
.drawer-head{padding:20px 22px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-start;gap:14px;}
.drawer-body{flex:1;overflow-y:auto;padding:0 0 30px;}
.dtabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--border-soft);}
.dtab{padding:12px 12px;font-size:12px;font-weight:700;color:var(--text-400);border-bottom:2px solid transparent;}
.dtab.active{color:var(--indigo-600);border-color:var(--indigo-500);}
.dpane{display:none;padding:18px 22px;}
.dpane.active{display:block;}
.kv-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.kv-row .k{color:var(--text-400);}
.kv-row .v{font-weight:600;color:var(--text-900);}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy-950);color:#fff;padding:11px 16px;border-radius:10px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:toastin .2s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.toast .dot{width:7px;height:7px;border-radius:50%;background:var(--green-500);}

/* attendance grid */
.att-grid{display:flex;flex-direction:column;gap:8px;}
.att-row{display:grid;grid-template-columns:32px 1.6fr repeat(4,64px) 1fr;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border-soft);border-radius:9px;}
.att-status-btn{width:100%;padding:6px 0;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:11px;font-weight:700;color:var(--text-400);}
.att-status-btn.sel-present{background:var(--teal-50);color:var(--teal-700);border-color:var(--teal-500);}
.att-status-btn.sel-absent{background:var(--red-50);color:var(--red-700);border-color:var(--red-500);}
.att-status-btn.sel-late{background:var(--amber-50);color:var(--amber-700);border-color:var(--amber-500);}
.att-status-btn.sel-leave{background:var(--purple-50);color:var(--purple-700);border-color:var(--purple-500);}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{font-size:10px;font-weight:700;color:var(--text-400);text-align:center;text-transform:uppercase;}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:1px solid var(--border-soft);color:var(--text-600);}
.cal-cell.present{background:var(--teal-50);color:var(--teal-700);border-color:transparent;}
.cal-cell.absent{background:var(--red-50);color:var(--red-700);border-color:transparent;}
.cal-cell.late{background:var(--amber-50);color:var(--amber-700);border-color:transparent;}
.cal-cell.leave{background:var(--purple-50);color:var(--purple-700);border-color:transparent;}
.cal-cell.blank{background:transparent;border-color:transparent;}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-600);margin-top:12px;flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

/* settings tabs */
.settings-shell{display:grid;grid-template-columns:200px 1fr;gap:18px;}
.settings-nav{display:flex;flex-direction:column;gap:2px;}
.settings-nav button{text-align:left;padding:10px 12px;border-radius:8px;border:none;background:transparent;font-size:12.5px;font-weight:600;color:var(--text-600);}
.settings-nav button.active{background:var(--indigo-100);color:var(--indigo-600);}
.spane{display:none;}
.spane.active{display:block;}

/* receipt / invoice preview */
.doc-preview{background:#fff;border:1px solid var(--border);border-radius:12px;padding:26px;font-size:12px;color:var(--text-700);}
.doc-preview h2{margin:0 0 2px;font-size:16px;}
.doc-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);}
.doc-total{display:flex;justify-content:space-between;padding:10px 0;font-weight:800;font-size:13.5px;border-top:2px solid var(--text-900);margin-top:6px;}

/* certificate */
.cert-card{
  border-radius:16px;padding:26px;position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(circle at 20% 20%, #24306B, #0A0E1D 70%);
  border:6px solid #C9A44C;
}
.cert-card::before{content:"";position:absolute;inset:14px;border:1px solid rgba(201,164,76,.5);border-radius:10px;pointer-events:none;}
.cert-card h2{font-family:'JetBrains Mono',monospace;letter-spacing:2px;font-size:12px;color:#C9A44C;text-align:center;margin:0;text-transform:uppercase;}
.cert-card h1{text-align:center;font-size:26px;margin:8px 0;}
.cert-card .cn{text-align:center;color:#B9C1E0;font-size:12px;margin-bottom:16px;}
.cert-card .studentname{text-align:center;font-size:22px;font-weight:800;margin:14px 0;color:#FFD98A;}
.cert-card p{text-align:center;color:#C9CFE6;font-size:12.5px;line-height:1.7;}
.cert-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;}
.qr-box{width:64px;height:64px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#0A0E1D;font-size:9px;font-weight:700;text-align:center;}

/* auth screen */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0A0E1D 0%,#141A33 45%,#1B2340 100%);position:relative;overflow:hidden;}
#authScreen::before{content:"";position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(79,107,255,.35),transparent 70%);top:-200px;right:-150px;}
.auth-card{width:380px;background:rgba(255,255,255,.98);border-radius:18px;padding:32px 30px;box-shadow:var(--shadow-lg);position:relative;z-index:2;}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.auth-card h1{font-size:19px;margin:0 0 4px;}
.auth-card p.sub{color:var(--text-400);font-size:12.5px;margin:0 0 22px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}

function inScope(centre){
  if(session.role==='counsellor' || session.role==='admin') return true; // simplified branch scoping demo (Delhi default)
  if(currentScope==='all') return true;
  return centre===currentScope;
}
function scopedLeads(){ return LEADS.filter(l=>inScope(l.centre)); }
function scopedStudents(){ return STUDENTS.filter(s=>inScope(s.centre)); }

let currentPanel='dashboard';
function goPanel(key, ctx){
  if(!PANEL_ACCESS[key] || !PANEL_ACCESS[key].includes(session.role)){ toast('You do not have access to this panel.'); return; }
  currentPanel=key;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.panel===key));
  renderPanel(key, ctx);
}
function renderPanel(key, ctx){
  const [title,sub] = PANEL_TITLES[key] || ['','' ];
  document.getElementById('pgTitle').textContent=title;
  document.getElementById('pgSub').textContent=sub;
  const c = document.getElementById('content');
  c.innerHTML = RENDERERS[key] ? RENDERERS[key](ctx) : '<div class="empty-state">Coming soon.</div>';
  if(key==='dashboard') mountDashboardCharts();
  if(key==='finance') mountFinanceChart();
}

function toast(msg){
  const w=document.getElementById('toastWrap');
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`<span class="dot"></span>${msg}`;
  w.appendChild(t);
  setTimeout(()=>t.remove(),3200);
}

RENDERERS.dashboard = function(){

  const enrolled = students.length;
  const conv = leads.length? Math.round((students.length/(students.length+leads.length))*100):0;
  const collected = students.reduce((a,s)=>a+s.paidAmount,0);
  const due = students.reduce((a,s)=>a+(s.totalFee-s.discountAmount-s.paidAmount),0);
  const funnelCounts = STAGES.map(st=>{
    if(['Enrolled','In Training','Course Completed','Placed'].includes(st)){
      return students.filter(s=> st==='Enrolled'? true : s.status===st || (st==='Enrolled')).length;
    }
    return leads.filter(l=>l.stage===st).length;
  });

  const trueFunnel = {
    'New Lead': leads.filter(l=>l.stage==='New Lead').length,
    'Contacted': leads.filter(l=>l.stage==='Contacted').length,

    'Placed': students.filter(s=>s.status==='Placed').length,

  const recent = [...students].slice(-6).reverse();

  return `
  <div class="grid-metrics">
    ${metricCard('Active leads', activeLeads, 'var(--indigo-500)', '+12% this month','up')}
    ${metricCard('Enrolled', enrolled, 'var(--green-500)', '+4 this week','up')}
    ${metricCard('Conversion', conv+'%', 'var(--purple-500)', 'lead → student','')}
    ${metricCard('Collected', fmt(collected), 'var(--teal-500)', 'across '+students.length+' students','')}
    ${metricCard('Due', fmt(due), 'var(--red-500)', 'pending collection','down')}

    <div class="card">
      <div class="card-head"><div><h3>Admissions funnel</h3><div class="sub">New Lead → Placed, current scope</div></div></div>
      <div class="card-body">
        <div class="funnel-wrap">
          ${Object.entries(trueFunnel).map(([k,v])=>`
            <div class="funnel-row">
              <div class="flabel">${k}</div>
              <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${Math.max((v/maxF)*100,6)}%"><span>${v}</span></div></div>
              <div class="fval">${v} nos.</div>
            </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><div><h3>Performance by centre</h3><div class="sub">Share of enrolled students</div></div></div>
      <div class="card-body" style="display:flex;flex-direction:column;align-items:center;">
        <canvas id="centrePie" width="230" height="230"></canvas>
      </div>
    </div>
  </div>
  <div class="two-col">
    <div class="card">
      <div class="card-head"><div><h3>Recent admissions</h3><div class="sub">Latest enrolled students</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>Student</th><th>Course</th><th>Centre</th><th>Admission No.</th><th>Fee</th><th>Status</th></tr></thead><tbody>
        ${recent.map(s=>`<tr class="clickable" onclick="openStudentProfile('${s.id}')">
          <td>${nameCell(s.name)}</td><td>${s.course}</td><td>${s.centre}</td>
          <td class="mono">${s.admissionNumber}</td><td class="mono">${fmt(s.totalFee)}</td>
          <td>${statusBadge(s.status)}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div class="card">
      <div class="card-head"><div><h3>Collection status</h3><div class="sub">Paid vs due, this scope</div></div></div>
      <div class="card-body" style="display:flex;flex-direction:column;align-items:center;">
        <canvas id="collectPie" width="200" height="200"></canvas>
        <div class="legend">
          <span><i style="background:var(--green-500)"></i>Collected ${fmt(collected)}</span>
          <span><i style="background:var(--red-500)"></i>Due ${fmt(due)}</span>
        </div>

};
function metricCard(label,val,color,delta,dir){
  return `<div class="metric-card">
    <div class="m-label"><span class="m-dot" style="background:${color}"></span>${label}</div>
    <div class="m-value">${val}</div>
    <div class="m-delta ${dir}">${delta}</div>

}
function nameCell(n){

}
function statusBadge(status){
  const map={
    'New Lead':'gray','Contacted':'blue','Demo / Visit':'purple','Counselling':'amber',
    'Enrolled':'blue','In Training':'amber','Course Completed':'green','Placed':'green','Dropped':'red',
    'Warm':'amber','Hot':'red','Cold':'gray',
    'Paid':'green','Partial':'amber','Due':'red','Overdue':'red',
    'Issued':'green','Not ready':'gray',
  };
  const cls = map[status]||'gray';
  return `<span class="badge badge-${cls}"><span class="badge-dot" style="background:currentColor"></span>${status}</span>`;
}
function mountDashboardCharts(){
  const students = scopedStudents();

  const ctx1 = document.getElementById('centrePie');
  if(ctx1){
    new Chart(ctx1, {type:'doughnut', data:{
      labels:Object.keys(byCentre),
      datasets:[{data:Object.values(byCentre), backgroundColor:['#4F6BFF','#17A673','#F5A524','#8B5CF6','#14B8A6','#E5484D'], borderWidth:3, borderColor:'#fff'}]
    }, options:{plugins:{legend:{position:'bottom', labels:{boxWidth:9,font:{size:10.5,family:'Inter'}}}}, cutout:'62%'}});
  }
  const collected = students.reduce((a,s)=>a+s.paidAmount,0);
  const due = students.reduce((a,s)=>a+(s.totalFee-s.discountAmount-s.paidAmount),0);
  const ctx2 = document.getElementById('collectPie');
  if(ctx2){
    new Chart(ctx2,{type:'doughnut', data:{labels:['Collected','Due'], datasets:[{data:[collected,due], backgroundColor:['#17A673','#E5484D'], borderWidth:3, borderColor:'#fff'}]},

  }
}

function filterLeadsTable(){
  const q=(event&&event.target&&event.target.tagName==='INPUT'?event.target.value:'').toLowerCase();

  const couns=document.getElementById('lfCounsellor').value;
  let rows=scopedLeads().filter(l=>
    (!q || l.name.toLowerCase().includes(q) || l.phone.includes(q)) &&
    (!stage||l.stage===stage) && (!centre||l.centre===centre) && (!couns||l.counsellor===couns));
  document.querySelector('#leadsTable tbody').innerHTML = leadsRows(rows);
}

  const l=LEADS.find(x=>x.id===id); l.stage=val; toast(`${l.name} moved to “${val}”.`);

RENDERERS.batch = function(ctx){
  const students = scopedStudents();
  const inBatch = students.filter(s=>s.batch).length;

/* ---- STUDENTS (shared table renderer) ---- */
function studentsTable(list, showCounsellorAssign){
  if(!list.length) return `<div class="empty-state"><h4>No students found</h4><p>Adjust filters or check back later.</p></div>`;
  return `<div class="table-wrap"><table><thead><tr>
    <th>Student</th><th>Course</th><th>Centre</th><th>Batch</th><th>Counsellor</th><th>Fee</th><th>Paid</th><th>Status</th><th></th>
  </tr></thead><tbody>
  ${list.map(s=>{
    const pct = Math.min(100, Math.round((s.paidAmount/(s.totalFee-s.discountAmount))*100));
    return `<tr class="clickable" onclick="openStudentProfile('${s.id}')">
      <td>${nameCell(s.name)}<div class="cell-sub" style="margin-left:39px;">${s.admissionNumber}</div></td>
      <td>${s.course}</td><td>${s.centre}</td><td>${s.batch||'<span class="cell-sub">Unassigned</span>'}</td>
      <td onclick="event.stopPropagation()">${showCounsellorAssign?`<select class="fbtn" style="padding:5px 6px;font-size:11.5px" onchange="reassignCounsellor('${s.id}',this.value)">${COUNSELLORS.map(c=>`<option ${c===s.counsellor?'selected':''}>${c}</option>`).join('')}</select>`:s.counsellor}</td>
      <td class="mono">${fmt(s.totalFee)}</td>
      <td><span class="progress-track"><span class="progress-fill" style="width:${pct}%"></span></span> <span class="cell-sub">${pct}%</span></td>
      <td onclick="event.stopPropagation()">
        <select class="fbtn" style="padding:5px 6px;font-size:11.5px" onchange="updateStudentStatus('${s.id}',this.value)">
          ${['Enrolled','In Training','Course Completed','Placed','Dropped'].map(st=>`<option ${st===s.status?'selected':''}>${st}</option>`).join('')}
        </select>
      </td>
      <td onclick="event.stopPropagation()"><button class="btn btn-sm btn-soft" onclick="openStudentProfile('${s.id}')">Open</button></td>
    </tr>`;}).join('')}
  </tbody></table></div>`;
}
function updateStudentStatus(id,val){ const s=STUDENTS.find(x=>x.id===id); s.status=val; toast(`${s.name} status set to “${val}”.`); renderPanel(currentPanel); }
function reassignCounsellor(id,val){ const s=STUDENTS.find(x=>x.id===id); s.counsellor=val; toast(`${s.name} reassigned to ${val}.`); }

/* ---- FINANCE ---- */
RENDERERS.finance = function(){
  const students = scopedStudents();
  const billed = students.reduce((a,s)=>a+s.totalFee,0);
  const collected = students.reduce((a,s)=>a+s.paidAmount,0);
  const due = billed - students.reduce((a,s)=>a+s.discountAmount,0) - collected;
  return `
  <div class="grid-metrics" style="grid-template-columns:repeat(4,1fr)">
    ${metricCard('Total billed (incl. GST)', fmt(billed), 'var(--indigo-500)','','')}
    ${metricCard('Collected', fmt(collected), 'var(--green-500)','','')}
    ${metricCard('Pending due', fmt(due), 'var(--red-500)','','')}
    ${metricCard('Students', students.length, 'var(--purple-500)','','')}
  </div>
  <div class="two-col">
    <div class="card">
      <div class="card-head"><div><h3>Fee ledger</h3><div class="sub">Per-student billing summary</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>Student</th><th>Centre</th><th>Course</th><th>Fee (incl. GST)</th><th>Paid</th><th>Due</th><th>Status</th></tr></thead><tbody>
      ${students.map(s=>{
        const netFee=s.totalFee-s.discountAmount; const due2=netFee-s.paidAmount;
        const status = due2<=0?'Paid':(s.paidAmount>0?'Partial':'Due');
        return `<tr class="clickable" onclick="openStudentProfile('${s.id}')">
          <td>${nameCell(s.name)}</td><td>${s.centre}</td><td>${s.course}</td>
          <td class="mono">${fmt(s.totalFee)}</td><td class="mono">${fmt(s.paidAmount)}</td><td class="mono">${fmt(Math.max(due2,0))}</td>
          <td>${statusBadge(status)}</td></tr>`;
      }).join('')}
      </tbody></table></div>
    </div>
    <div class="card">
      <div class="card-head"><div><h3>Billed vs collected</h3></div></div>
      <div class="card-body" style="display:flex;flex-direction:column;align-items:center;">
        <canvas id="financePie" width="200" height="200"></canvas>
      </div>
    </div>
  </div>`;
};
function mountFinanceChart(){
  const students = scopedStudents();
  const collected = students.reduce((a,s)=>a+s.paidAmount,0);
  const billed = students.reduce((a,s)=>a+s.totalFee-s.discountAmount,0);
  const ctx = document.getElementById('financePie');
  if(ctx) new Chart(ctx,{type:'pie', data:{labels:['Collected','Outstanding'],datasets:[{data:[collected, Math.max(billed-collected,0)], backgroundColor:['#4F6BFF','#F5A524'],borderWidth:3,borderColor:'#fff'}]}, options:{plugins:{legend:{position:'bottom',labels:{boxWidth:9,font:{size:10.5}}}}}});
}

function receiptMarkup(s,p){
  const before = s.payments.filter(x=>x.no<p.no).reduce((a,x)=>a+x.amount,0);

  const netFee=s.totalFee-s.discountAmount;
  return `<div class="doc-preview">

    <div class="doc-row"><span>Payment type / mode</span><span>${p.mode}${s.emi?' · Installment '+p.no:''}</span></div>
    <div class="doc-row"><span>Paid before this</span><span class="mono">${fmt(before)}</span></div>
    <div class="doc-row"><span>This payment</span><span class="mono">${fmt(p.amount)}</span></div>
    <div class="doc-total"><span>Paid till date</span><span class="mono">${fmt(till)}</span></div>
    <div class="doc-row" style="margin-top:8px;"><span>Balance</span><span class="mono">${fmt(Math.max(netFee-till,0))}</span></div>
    <div class="cell-sub" style="margin-top:8px;">Amount in words: Rupees ${p.amount.toLocaleString('en-IN')} only</div>
    <div class="cell-sub" style="margin-top:6px;">Bank details: iMED Academy Pvt Ltd · HDFC Bank · A/C 50200012345678</div>
  </div>`;
}

/* ================= MODAL ================= */
function openModal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('modalOverlay').classList.add('show'); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalOverlay').addEventListener('click',e=>{ if(e.target.id==='modalOverlay') closeModal(); });

/* ================= CERT VERIFY PUBLIC PAGE ================= */
function renderVerify(certNumber){
  const s = STUDENTS.find(x=>x.certificate && x.certificate.number===certNumber);
  const el = document.getElementById('verifyScreen');
  el.innerHTML = `<div class="verify-card">
    <div class="verify-head">
      <div style="display:flex;align-items:center;gap:10px;"><div class="brand-mark">iM</div><div><b style="font-size:14px;">iMED Academy</b><div style="font-size:10.5px;color:#B9C1E0;">Certificate Verification</div></div></div>
    </div>
    <div class="verify-body">
      ${s? `
        <div class="badge badge-green" style="margin-bottom:14px;">✓ Certificate verified</div>
        <div class="kv-row"><span class="k">Certificate No.</span><span class="v mono">${s.certificate.number}</span></div>
        <div class="kv-row"><span class="k">Student</span><span class="v">${s.name}</span></div>
        <div class="kv-row"><span class="k">Course</span><span class="v">${COURSES.find(c=>c.code===s.course)?.name}</span></div>
        <div class="kv-row"><span class="k">Centre</span><span class="v">${s.centre}</span></div>
        <div class="kv-row"><span class="k">Admission No.</span><span class="v mono">${s.admissionNumber}</span></div>
        <div class="kv-row"><span class="k">Issue date</span><span class="v">${s.certificate.issueDate}</span></div>
      `:`
        <div class="badge badge-red" style="margin-bottom:14px;">✕ Not found</div>
        <p style="color:var(--text-600);font-size:12.5px;">We couldn't verify certificate <span class="mono">${certNumber}</span>. Check the number and try again, or contact your centre.</p>
      `}
      <button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:16px;" onclick="location.hash='#admin'">Go to admin login</button>
    </div>
  </div>`;
}

/* ================= BOOT / ROUTING ================= */
function boot(){
  const hash = location.hash;
  if(hash.startsWith('#verify=')){
    document.getElementById('authScreen').style.display='none';
    document.getElementById('app').classList.remove('active');
    document.getElementById('verifyScreen').classList.add('active');
    renderVerify(decodeURIComponent(hash.split('=')[1]));
    return;
  }
  document.getElementById('verifyScreen').classList.remove('active');
  if(!session){
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('app').classList.remove('active');
    return;
  }
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').classList.add('active');
  renderSidebar();
  renderScopeSelector();
  goPanel('dashboard');
}
window.addEventListener('hashchange', boot);
buildRoleGrid();
boot();
</script>
